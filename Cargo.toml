[package]
name = "icarus-v2mini"
version = "0.4.0"
edition = "2024"
description = "Native Linux configuration tool and driver for ICARUS V2 MINI gaming mouse"
license = "MIT"
repository = "https://github.com/ayrazarya/icarus-v2mini-rea"
readme = "README.md"
keywords = ["mouse", "gaming", "driver", "paw3395", "linux"]
categories = ["hardware-support", "gui"]

[dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3.4"
toml = "0.8"
anyhow = "1"
colored = "3"
thiserror = "2"
eframe = { version = "0.29", features = ["glow", "x11", "wayland", "default_fonts"] }
egui_extras = { version = "0.29", features = ["all_loaders", "image"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
redundant_clone = "deny"
clone_on_copy = "deny"
needless_collect = "deny"
manual_while_let_some = "deny"
or_fun_call = "warn"

